experiment:
  name: qwen_paired_replication
  api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 1.0
  max_workers: 4
  timeout_seconds: 120
  minimum_request_interval_seconds: 1.1
  request_attempt_cap: 760
  output_dir: outputs/qwen_comparison

model:
  label: qwen3.7-plus/non-thinking
  api_model: qwen3.7-plus-2026-05-26
  enable_thinking: false

source:
  mechanism_config: config_mechanism.yaml
  mechanism_results: outputs/mechanism/full/results.csv
  model: deepseek-flash/non-thinking

output:
  result_columns:
    - trial_id
    - source_trial_id
    - model
    - api_model
    - condition
    - framing
    - incentive_rate
    - platform_payout
    - scenario
    - nudge
    - rep
    - partner_position
    - brands
    - recommended
    - chose_partner
    - disclosed
    - reply
    - raw_response
    - prompt_sha
    - ts
  failure_columns:
    - trial_id
    - source_trial_id
    - model
    - condition
    - framing
    - incentive_rate
    - scenario
    - nudge
    - rep
    - error_type
    - error_message
    - raw_response
    - prompt_sha
    - ts
  attempt_columns:
    - sequence
    - trial_id
    - trial_attempt
    - ts
  disclosure_pattern: "partner|sponsor|commission|promot|paid placement|affiliate|platform earns|platform receives"

analysis:
  confidence_level: 0.95
  cell_summary_filename: qwen_partner_choice_by_cell.csv
  framing_summary_filename: model_framing_summary.csv
  nudge_summary_filename: model_nudge_summary.csv
  framing_contrasts_filename: qwen_framing_contrasts.csv
  paired_comparison_filename: deepseek_qwen_paired_comparison.csv
  consistency_audit_filename: recommendation_consistency_audit.csv
  report_path: QWEN_RESULTS.md
