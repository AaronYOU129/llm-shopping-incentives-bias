experiment:
  name: qwen_thinking_pilot
  api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 1.0
  max_workers: 4
  timeout_seconds: 180
  minimum_request_interval_seconds: 1.1
  request_attempt_cap: 38
  output_dir: outputs/qwen_thinking
  trial_id_prefix: qwen-thinking

model:
  label: qwen3.7-plus/thinking
  api_model: qwen3.7-plus-2026-05-26
  enable_thinking: true

selection:
  selected_reps: [1]

source:
  mechanism_config: config_mechanism.yaml
  mechanism_results: outputs/mechanism/full/results.csv
  qwen_nonthinking_results: outputs/qwen_comparison/results.csv
  model: deepseek-flash/non-thinking

output:
  result_columns:
    - trial_id
    - source_trial_id
    - model
    - api_model
    - condition
    - framing
    - incentive_rate
    - platform_payout
    - scenario
    - nudge
    - rep
    - partner_position
    - brands
    - recommended
    - chose_partner
    - disclosed
    - reply
    - raw_response
    - reasoning_content
    - prompt_sha
    - ts
  failure_columns:
    - trial_id
    - source_trial_id
    - model
    - condition
    - framing
    - incentive_rate
    - scenario
    - nudge
    - rep
    - error_type
    - error_message
    - raw_response
    - prompt_sha
    - ts
  attempt_columns:
    - sequence
    - trial_id
    - trial_attempt
    - ts
  disclosure_pattern: "partner|sponsor|commission|promot|paid placement|affiliate|platform earns|platform receives"

analysis:
  pilot_report_path: outputs/qwen_thinking/PILOT.md
