experiment:
  name: qwen_thinking_full
  api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 1.0
  max_workers: 4
  timeout_seconds: 180
  minimum_request_interval_seconds: 1.1
  request_attempt_cap: 761
  authorized_replacement_trial_ids:
    - qwen-thinking:mechanism:full:deepseek-flash/non-thinking:incentive:fixed_amount:rate=10:shoes:nudge=0:rep=20
  output_dir: outputs/qwen_thinking
  trial_id_prefix: qwen-thinking

model:
  label: qwen3.7-plus/thinking
  api_model: qwen3.7-plus-2026-05-26
  enable_thinking: true

source:
  mechanism_config: config_mechanism.yaml
  mechanism_results: outputs/mechanism/full/results.csv
  qwen_nonthinking_results: outputs/qwen_comparison/results.csv
  model: deepseek-flash/non-thinking

output:
  result_columns:
    - trial_id
    - source_trial_id
    - model
    - api_model
    - condition
    - framing
    - incentive_rate
    - platform_payout
    - scenario
    - nudge
    - rep
    - partner_position
    - brands
    - recommended
    - chose_partner
    - disclosed
    - reply
    - raw_response
    - reasoning_content
    - prompt_sha
    - ts
  failure_columns:
    - trial_id
    - source_trial_id
    - model
    - condition
    - framing
    - incentive_rate
    - scenario
    - nudge
    - rep
    - error_type
    - error_message
    - raw_response
    - prompt_sha
    - ts
  attempt_columns:
    - sequence
    - trial_id
    - trial_attempt
    - ts
  disclosure_pattern: "partner|sponsor|commission|promot|paid placement|affiliate|platform earns|platform receives"

analysis:
  confidence_level: 0.95
  framing_summary_filename: thinking_vs_nonthinking_by_framing.csv
  nudge_summary_filename: thinking_vs_nonthinking_by_nudge.csv
  framing_nudge_filename: thinking_vs_nonthinking_by_framing_nudge.csv
  report_path: QWEN_THINKING_RESULTS.md
